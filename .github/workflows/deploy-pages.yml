name: Deploy site to GitHub Pages
on:
  push:
    branches: [ develop ]
  workflow_dispatch:
  repository_dispatch:
    types: [ cli-released ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download the CLI install scripts
        env:
          CLI_DOWNLOAD_URL: ${{ vars.CLI_DOWNLOAD_URL || 'https://github.com/Spool-FRAMEWORK/cli/releases/latest/download' }}
        run: |
          for script in install.sh install.ps1; do
            if curl --fail --silent --show-error --location --retry 3 --output "public/$script" "$CLI_DOWNLOAD_URL/$script"; then
              echo "Downloaded $script from the latest CLI release."
            else
              rm -f "public/$script"
              echo "::warning title=CLI install script missing::$script is not in the latest CLI release, so the site is deployed without it."
            fi
          done
      - name: Download the OpenAPI contracts
        env:
          OPENAPI_REF: ${{ vars.OPENAPI_REF }}
        run: npm run fetch:openapi
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
